# the documentation site, docs.mailam.app/bruno (make docs, make docs-serve): built by Zensical
# from docs/, the clients' READMEs included where they live (JSR shows them too)
[project]
site_name = "Bruno"
site_url = "https://docs.mailam.app/bruno/"
site_description = "A permissionless post-paid gas relay: a call pays for its own gas as it runs, in ETH or any token, or over x402"
site_author = "Mai Làm Labs"
copyright = "mai-lam-labs. The documentation and its examples: CC0 1.0."
repo_url = "https://github.com/mai-lam-labs/bruno"
repo_name = "mai-lam-labs/bruno"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "dist/docs"

nav = [
  { "Overview" = "index.md" },
  { "Using Bruno" = [
    { "Getting started" = "using/index.md" },
    { "Interfaces" = [
      { "REST" = "using/rest.md" },
      { "JSON-RPC" = "using/json-rpc.md" },
      { "x402" = "using/x402.md" },
    ] },
    { "Integrations" = [
      { "TypeScript client" = "using/typescript.md" },
      { "AgentKit" = "using/agentkit.md" },
      { "ERC-4337 accounts" = [
        { "ERC-4337 accounts" = "using/user-operations/index.md" },
        { "viem, paying in ETH" = "using/user-operations/viem-eth.md" },
        { "ZeroDev, paying in ETH" = "using/user-operations/zerodev-eth.md" },
        { "An EOA, with viem" = "using/user-operations/viem-eoa.md" },
        { "An EOA, with permissionless.js" = "using/user-operations/permissionless-eoa.md" },
        { "An EOA, with ZeroDev" = "using/user-operations/zerodev-eoa.md" },
        { "An EOA, with MetaMask's Smart Accounts Kit" = "using/user-operations/metamask-eoa.md" },
        { "An EOA, with Alchemy's smart accounts" = "using/user-operations/alchemy-eoa.md" },
        { "viem, paying in a token" = "using/user-operations/viem-token.md" },
        { "An EOA paying in a token, with viem" = "using/user-operations/viem-eoa-token.md" },
        { "ZeroDev, paying in a token" = "using/user-operations/zerodev-token.md" },
        { "USDC through Circle's paymaster" = "using/user-operations/viem-circle.md" },
      ] },
    ] },
  ] },
  { "Support" = "support.md" },
  { "Networks and builders" = "networks.md" },
  { "Specification" = "SPEC.md" },
  { "Deployment" = "DEPLOYMENT.md" },
]

# docs/development/ is the project's own, read in the repository: working on Bruno, its design,
# releasing and the roadmap, kept off the site
exclude_docs = """
development/
"""

[project.theme]
language = "en"
logo = "assets/bruno.svg"
favicon = "assets/mailam.png"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
# the clients' READMEs, included from the repository's root; a missing one fails the build
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
