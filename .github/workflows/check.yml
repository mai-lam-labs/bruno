name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# a newer push to a pull request's branch supersedes its run in progress, which is
# cancelled; each push to main is checked in full
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # the gate takes a few minutes, toolchain install included: one that hangs fails here,
    # not at GitHub's 6-hour limit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # the pinned tools (Makefile: anvil, Deno, workerd) and Deno's package cache: kept
      # between runs, so a run doesn't depend on the release assets still being there
      - uses: actions/cache@v5
        with:
          path: |
            dist/tools/nightly-*
            dist/tools/deno-*
            dist/tools/workerd-*
            .deno
          key: tools-${{ hashFiles('Makefile', 'worker/deno.lock') }}

      - name: Install toolchain
        run: make install

      - name: CI (lint, format, typecheck; tests on Prague and Amsterdam anvils)
        run: make ci

  # the server's image, built from every pull request; pushed to ghcr.io from main and from
  # version tags, once the gate has passed
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
