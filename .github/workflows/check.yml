name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# a newer push to a pull request's branch supersedes its run in progress, which is
# cancelled; each push to main is checked in full
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # the gate takes a few minutes, toolchain install included: one that hangs fails here,
    # not at GitHub's 6-hour limit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # the pinned tools (Makefile: anvil, Deno, workerd) and Deno's package cache: kept
      # between runs, so a run doesn't depend on the release assets still being there
      - uses: actions/cache@v5
        with:
          path: |
            dist/tools/nightly-*
            dist/tools/deno-*
            dist/tools/workerd-*
            .deno
          key: tools-${{ hashFiles('Makefile', 'worker/deno.lock') }}

      - name: Install toolchain
        run: make install

      - name: CI (lint, format, typecheck; tests on Prague and Amsterdam anvils)
        run: make ci

  # the server's image, built from every pull request and started once to show it runs;
  # pushed to ghcr.io from main and from version tags, once the gate has passed. A version
  # tag must be pyproject.toml's version
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "${GITHUB_REF_NAME}" = "v${version}" || \
            { echo "tag ${GITHUB_REF_NAME} isn't pyproject.toml's version ${version}"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # built into the runner's images first, and started: the server's options parsed, every
      # module imported
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bruno:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts
        run: docker run --rm bruno:smoke --help
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # a version tag's GitHub release, once its image is pushed: notes from the merged pull
  # requests, and the image to pull
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes \
            --notes "Docker: \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}\` (DEPLOYMENT.md, Docker)."
