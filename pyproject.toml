[project]
name = "bruno"
version = "0.5.1"
description = "Permissionless post-paid gas relay"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.14"
dependencies = [
    "eth-abi>=5.0.0",
    "eth-account>=0.13.0",
    "httpx>=0.28.0",
    "litestar>=2.25.0",
    "msgspec>=0.22.0",
    "segno>=1.6.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/mai-lam-labs/bruno"
Documentation = "https://docs.mailam.app/bruno/"

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "ty==0.0.61",
    "pyrefly==1.0.0",
    "coverage==7.6.1",
    "pytest==8.3.2",
    "pytest-asyncio>=0.24.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0",
    # x402's own SDK, its reference client and its models the judge in the conformance suite
    # (bruno/tests/test_conformance.py): a test's dependency, never the relay's
    "x402[httpx,evm]==2.25.0",
    # the documentation site (make docs): Material for MkDocs' successor, by its authors
    "zensical==0.0.72",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# live tests spend real (testnet) funds: only ever run when asked for, with -m hoodi or -m sepolia;
# the burn-in takes minutes, and runs on its own (make burn-in); AgentKit's needs Docker and the
# packages installed by npm (make npm-e2e)
addopts = "-m 'not hoodi and not sepolia and not burnin and not npm'"
markers = [
    "hoodi: runs against Hoodi and Titan's builder there, spending Hoodi ETH (make check-hoodi)",
    "sepolia: runs against Sepolia and an ePBS builder there, spending Sepolia ETH (make check-sepolia)",
    "burnin: a long randomised run on the local chain, against both relays (make burn-in)",
    "npm: AgentKit run by Node in Docker, from the packages npm installs (make npm-e2e)",
]
